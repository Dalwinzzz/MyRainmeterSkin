; ============================================================
;  86 HUD · Music Player
;  Long horizontal bar with track info / progress / controls.
;
;  v1 default source: WebNowPlaying-Redux (third-party plugin).
;  Install: https://github.com/keifufu/WebNowPlaying-Redux
;  Plus the SMTC adapter for native NetEase / QQ Music desktop:
;       https://github.com/keifufu/WebNowPlaying-Redux-SMTC
;
;  To switch source, edit @Resources/Variables.inc → MusicSource.
;  Available: WNP | Spotify | TitleSniff
;  This file ships WNP measures active; other sources commented below.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
@include=#@#Variables.inc

[Metadata]
Name=86 Music
Author=Dalwin
Information=Now-playing readout. Default source is WebNowPlaying-Redux.
Version=1.1.0
License=MIT

; ============ MEASURES (WNP — default) ============

[mPlayerTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
Substitute="":"——"

[mPlayerArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
Substitute="":"未在播放"

[mPlayerStatus]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
; 0 = stopped, 1 = playing, 2 = paused

[mPlayerStatusLabel]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
Substitute="0":"已停止","1":"正在播放","2":"已暂停"

[mPlayerPosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
; HH:MM:SS or MM:SS string

[mPlayerDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration

[mPlayerProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress
; 0-100 numeric

; Pin X = bar left (18) + progress fraction × bar width (304).
; Drives the diamond pin so it rides the fill head instead of parking
; at the far right.
[mPinX]
Measure=Calc
Formula=(18 + (mPlayerProgress / 100) * 304)
DynamicVariables=1

; Play/pause glyph follows state: 1=playing -> pause icon, else play icon.
; Segoe MDL2 Assets: Play=E768, Pause=E769.
[mPlayGlyph]
Measure=Calc
Formula=mPlayerStatus
IfCondition=(mPlayerStatus = 1)
IfTrueAction=[!SetOption mtrPlay Text "⏸"][!UpdateMeter mtrPlay][!Redraw]
IfFalseAction=[!SetOption mtrPlay Text "⏵"][!UpdateMeter mtrPlay][!Redraw]
DynamicVariables=1

; ----- Spotify fallback (enable if MusicSource=Spotify) -----
; [mPlayerTitle]    Measure=NowPlaying  PlayerName=CAD  PlayerType=TITLE
; [mPlayerArtist]   Measure=NowPlaying  PlayerName=CAD  PlayerType=ARTIST
; [mPlayerProgress] Measure=NowPlaying  PlayerName=CAD  PlayerType=PROGRESS
; (See https://docs.rainmeter.net/manual/plugins/nowplaying/)

; ============ STYLES ============

[stHead]
FontFace=#FontFaceCN#
FontSize=9
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1

[stHeadSrc]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
StringAlign=Right
AntiAlias=1

[stTrack]
FontFace=#FontFaceCN#
FontSize=13
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
ClipString=1
AntiAlias=1

[stArtist]
FontFace=#FontFaceCN#
FontSize=10
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
ClipString=1
AntiAlias=1

[stTime]
FontFace=#FontFace#
FontSize=10
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1

[stControl]
FontFace=Segoe UI Symbol
FontSize=14
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringAlign=CenterCenter
AntiAlias=1

[stControlPlay]
FontFace=Segoe UI Symbol
FontSize=18
FontColor=#ColorRed#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringAlign=CenterCenter
AntiAlias=1

; ============ METERS ============
; Canvas: 540 × 100

; Corner brackets
[mtrCornerTL]
Meter=Shape
X=0
Y=0
Shape=Path tlPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
tlPath=0,12 | LineTo 0,0 | LineTo 12,0

[mtrCornerTR]
Meter=Shape
X=528
Y=0
Shape=Path trPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
trPath=0,0 | LineTo 12,0 | LineTo 12,12

[mtrCornerBL]
Meter=Shape
X=0
Y=88
Shape=Path blPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
blPath=0,0 | LineTo 0,12 | LineTo 12,12

[mtrCornerBR]
Meter=Shape
X=528
Y=88
Shape=Path brPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
brPath=12,0 | LineTo 12,12 | LineTo 0,12

; Top scan stripe
[mtrScan]
Meter=Shape
X=14
Y=4
Shape=Line 0,0,512,0 | StrokeWidth 2 | Stroke LinearGradient ScanGrad
ScanGrad=0 | #ColorCyanEdge# ; 0.0 | 30,90,200,0 ; 1.0

; Header — 状态文字 ('正在播放' / '已停止' / '已暂停')
[mtrHead]
Meter=String
MeterStyle=stHead
MeasureName=mPlayerStatusLabel
X=18
Y=12
Text=▶ %1

[mtrHeadSrc]
Meter=String
MeterStyle=stHeadSrc
X=522
Y=12
Text=WNP

; Track title (left half — never overlaps controls)
[mtrTrack]
Meter=String
MeterStyle=stTrack
MeasureName=mPlayerTitle
X=18
Y=26
W=300
H=22
Text=%1

[mtrArtist]
Meter=String
MeterStyle=stArtist
MeasureName=mPlayerArtist
X=18
Y=50
W=200
H=16
Text=%1

; Position · Duration label (right of artist row)
[mtrPosition]
Meter=String
MeterStyle=stTime
MeasureName=mPlayerPosition
X=222
Y=52
Text=%1

[mtrTimeSep]
Meter=String
MeterStyle=stTime
FontColor=#ColorCyanDim#
X=255
Y=52
Text=/

[mtrDuration]
Meter=String
MeterStyle=stTime
MeasureName=mPlayerDuration
FontColor=#ColorTextDim#
X=263
Y=52
Text=%1

; Progress bar — fill = red (focal position), track = blue (structure)
[mtrProgressBar]
Meter=Bar
MeasureName=mPlayerProgress
X=18
Y=72
W=304
H=3
BarOrientation=HORIZONTAL
BarColor=#ColorRed#
SolidColor=#ColorBlueDeep#

; Progress diamond pin (focal — red). X rides the fill head via mPinX,
; offset -3 so the 7px diamond is centered on the progress position.
[mtrProgressPin]
Meter=Shape
X=([mPinX]-3)
Y=70
Shape=Rectangle 0,0,7,7 | Rotate 45,3.5,3.5 | StrokeWidth 1 | Stroke Color #ColorRed# | Fill Color #ColorRed#
DynamicVariables=1

; ============ CONTROLS (right cluster, vertically centered) ============
; Three pill buttons, each with a visible box + transparent hit area.
; Cluster X span: 386 to 510 (right padding 30 from canvas right edge 540)

; Prev button
[mtrPrevBox]
Meter=Shape
X=386
Y=42
Shape=Rectangle 0,0,30,24,3 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 30,90,200,30

[mtrPrev]
Meter=String
MeterStyle=stControl
X=401
Y=54
Text=⏮

[mtrPrevHit]
Meter=Image
SolidColor=0,0,0,1
X=386
Y=42
W=30
H=24
LeftMouseUpAction=[!CommandMeasure mPlayerStatus "Previous"]
; Hover: box fill + stroke brighten, glyph goes to full white.
MouseOverAction=[!SetOption mtrPrevBox Shape "Rectangle 0,0,30,24,3 | StrokeWidth 1 | Stroke Color #ColorBlueIce# | Fill Color 30,90,200,90"][!SetOption mtrPrev FontColor #ColorText#][!UpdateMeter mtrPrevBox][!UpdateMeter mtrPrev][!Redraw]
MouseLeaveAction=[!SetOption mtrPrevBox Shape "Rectangle 0,0,30,24,3 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 30,90,200,30"][!SetOption mtrPrev FontColor #ColorCyanEdge#][!UpdateMeter mtrPrevBox][!UpdateMeter mtrPrev][!Redraw]
ToolTipText=上一首

; Play / Pause button (focal — red accent)
[mtrPlayBox]
Meter=Shape
X=422
Y=40
Shape=Rectangle 0,0,34,28,4 | StrokeWidth 1.4 | Stroke Color #ColorRed# | Fill Color 200,30,58,70

[mtrPlay]
Meter=String
MeterStyle=stControlPlay
X=439
Y=54
Text=⏵

[mtrPlayHit]
Meter=Image
SolidColor=0,0,0,1
X=422
Y=40
W=34
H=28
LeftMouseUpAction=[!CommandMeasure mPlayerStatus "PlayPause"]
; Focal button — hover deepens the red fill + brightens the stroke.
MouseOverAction=[!SetOption mtrPlayBox Shape "Rectangle 0,0,34,28,4 | StrokeWidth 1.4 | Stroke Color #ColorRedLight# | Fill Color 200,30,58,130"][!UpdateMeter mtrPlayBox][!Redraw]
MouseLeaveAction=[!SetOption mtrPlayBox Shape "Rectangle 0,0,34,28,4 | StrokeWidth 1.4 | Stroke Color #ColorRed# | Fill Color 200,30,58,70"][!UpdateMeter mtrPlayBox][!Redraw]
ToolTipText=播放 / 暂停

; Next button
[mtrNextBox]
Meter=Shape
X=462
Y=42
Shape=Rectangle 0,0,30,24,3 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 30,90,200,30

[mtrNext]
Meter=String
MeterStyle=stControl
X=477
Y=54
Text=⏭

[mtrNextHit]
Meter=Image
SolidColor=0,0,0,1
X=462
Y=42
W=30
H=24
LeftMouseUpAction=[!CommandMeasure mPlayerStatus "Next"]
MouseOverAction=[!SetOption mtrNextBox Shape "Rectangle 0,0,30,24,3 | StrokeWidth 1 | Stroke Color #ColorBlueIce# | Fill Color 30,90,200,90"][!SetOption mtrNext FontColor #ColorText#][!UpdateMeter mtrNextBox][!UpdateMeter mtrNext][!Redraw]
MouseLeaveAction=[!SetOption mtrNextBox Shape "Rectangle 0,0,30,24,3 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 30,90,200,30"][!SetOption mtrNext FontColor #ColorCyanEdge#][!UpdateMeter mtrNextBox][!UpdateMeter mtrNext][!Redraw]
ToolTipText=下一首
