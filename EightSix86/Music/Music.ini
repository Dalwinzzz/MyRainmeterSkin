; ============================================================
;  86 HUD · Music Player
;  Long horizontal bar with track info / progress / controls.
;
;  v1 default source: WebNowPlaying-Redux (third-party plugin).
;  Install: https://github.com/keifufu/WebNowPlaying-Redux
;  Plus the SMTC adapter for native NetEase / QQ Music desktop:
;       https://github.com/keifufu/WebNowPlaying-Redux-SMTC
;
;  To switch source, edit @Resources/Variables.inc → MusicSource.
;  Available: WNP | Spotify | TitleSniff
;  This file ships WNP measures active; other sources commented below.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
@include=#@#Variables.inc

[Metadata]
Name=86 Music
Author=Dalwin
Information=Now-playing readout. Default source is WebNowPlaying-Redux.
Version=1.0.0
License=MIT

; ============ MEASURES (WNP — default) ============

[mPlayerTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title

[mPlayerArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist

[mPlayerStatus]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
; 0 = stopped, 1 = playing, 2 = paused (per WNP spec)

[mPlayerPosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
; HH:MM:SS or MM:SS string

[mPlayerDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration

[mPlayerProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress
; 0-100 numeric

[mPlayerSource]
Measure=String
String=#MusicSource#
; Visible label of the music source (NETEASE / QQ MUSIC / SPOTIFY ...)

; ----- Spotify fallback (enable if MusicSource=Spotify) -----
; [mPlayerTitle]    Measure=NowPlaying  PlayerName=CAD  PlayerType=TITLE
; [mPlayerArtist]   Measure=NowPlaying  PlayerName=CAD  PlayerType=ARTIST
; [mPlayerProgress] Measure=NowPlaying  PlayerName=CAD  PlayerType=PROGRESS
; (See https://docs.rainmeter.net/manual/plugins/nowplaying/)

; ============ STYLES ============

[stHead]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[stHeadSrc]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
StringAlign=Right
AntiAlias=1

[stTrack]
FontFace=#FontFace#
FontSize=11
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
ClipString=1
AntiAlias=1

[stArtist]
FontFace=#FontFace#
FontSize=9
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
ClipString=1
AntiAlias=1

[stTime]
FontFace=#FontFace#
FontSize=9
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1

[stControl]
FontFace=Segoe UI Symbol
FontSize=14
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringAlign=CenterCenter
AntiAlias=1

[stControlPlay]
FontFace=Segoe UI Symbol
FontSize=18
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringAlign=CenterCenter
AntiAlias=1

; ============ METERS ============
; Canvas: 480 × 80

; Corner brackets
[mtrCornerTL]
Meter=Shape
X=0
Y=0
Shape=Path tlPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
tlPath=0,12 | LineTo 0,0 | LineTo 12,0

[mtrCornerTR]
Meter=Shape
X=468
Y=0
Shape=Path trPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
trPath=0,0 | LineTo 12,0 | LineTo 12,12

[mtrCornerBL]
Meter=Shape
X=0
Y=68
Shape=Path blPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
blPath=0,0 | LineTo 0,12 | LineTo 12,12

[mtrCornerBR]
Meter=Shape
X=468
Y=68
Shape=Path brPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
brPath=12,0 | LineTo 12,12 | LineTo 0,12

; Top scan stripe
[mtrScan]
Meter=Shape
X=14
Y=2
Shape=Line 0,0,452,0 | StrokeWidth 2 | Stroke LinearGradient ScanGrad
ScanGrad=0 | #ColorCyanEdge# ; 0.0 | 126,229,245,0 ; 1.0

; Header — NOW PLAYING
[mtrHead]
Meter=String
MeterStyle=stHead
X=18
Y=10
Text=▶ NOW PLAYING

[mtrHeadSrc]
Meter=String
MeterStyle=stHeadSrc
MeasureName=mPlayerSource
X=462
Y=10
Text=%1

; Track title (left half)
[mtrTrack]
Meter=String
MeterStyle=stTrack
MeasureName=mPlayerTitle
X=18
Y=26
W=240
H=18
Text=%1

[mtrArtist]
Meter=String
MeterStyle=stArtist
MeasureName=mPlayerArtist
X=18
Y=44
W=240
H=14
Text=%1

; Progress section (center)
[mtrPosition]
Meter=String
MeterStyle=stTime
MeasureName=mPlayerPosition
X=270
Y=38
Text=%1

[mtrProgressBar]
Meter=Bar
MeasureName=mPlayerProgress
X=302
Y=43
W=80
H=1
BarOrientation=HORIZONTAL
BarColor=#ColorCyanEdge#
SolidColor=#ColorCyanDeep#

; Progress diamond pin (always at bar end — visual flair)
[mtrProgressPin]
Meter=Shape
X=378
Y=39
Shape=Rectangle 0,0,8,8 | Rotate 45,4,4 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color #ColorCyanEdge#

[mtrDuration]
Meter=String
MeterStyle=stTime
MeasureName=mPlayerDuration
X=394
Y=38
Text=%1

; Controls (right)
[mtrPrev]
Meter=String
MeterStyle=stControl
X=420
Y=38
Text=⏮
LeftMouseUpAction=[!CommandMeasure mPlayerStatus "Previous"]
ToolTipText=Previous track

[mtrPlay]
Meter=String
MeterStyle=stControlPlay
X=440
Y=38
Text=⏵
LeftMouseUpAction=[!CommandMeasure mPlayerStatus "PlayPause"]
ToolTipText=Play / Pause

[mtrNext]
Meter=String
MeterStyle=stControl
X=460
Y=38
Text=⏭
LeftMouseUpAction=[!CommandMeasure mPlayerStatus "Next"]
ToolTipText=Next track
