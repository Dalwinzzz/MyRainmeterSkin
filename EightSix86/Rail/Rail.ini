; ============================================================
;  86 HUD · COMMAND RAIL  (v5 核心 — 左侧竖直指挥控制栏)
;  把所有数据组件归到左侧一条, 连续毛玻璃底 + 分隔线划分:
;    顶部  : 86 标识 (8红6) + SPEARHEAD / SAN MAGNOLIA · S-1 + ONLINE
;    S-1   : SYSTEM ROSTER 花名册 (CPU/MEM/DISK/GPU/NET↓/NET↑)
;    M     : MEDIA · PARA-RAID 音乐歌词
;    WK    : CALENDAR 日历 + 年度进度
;    底部  : EIGHTY-SIX · UNDERTAKER PROTOCOL
;
;  对应 v5 预览左侧栏: @Resources/docs/preview/v5/index.html
;  配色/字体来自 @Resources/Variables.inc
;
;  画布: 312 (宽) × 1080 (高, 贴左侧全屏)。部署时栏顶贴屏幕左上 (0,0)。
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; DWM 模糊 (Win10/11): 让半透明底真正"毛玻璃"。不支持时自动忽略, 仅半透明。
Blur=1
@include=#@#Variables.inc
OnRefreshAction=[!CommandMeasure mIntro "Execute 1"]

[Variables]
; 进场动画 alpha (整条栏从上往下点亮)
RailAlpha=0
; 花名册 DISK CRITICAL 闪烁状态 (Lua 驱动可后接)
DiskCrit=1

[Metadata]
Name=86 Command Rail
Author=Dalwin
Information=v5 左侧竖直指挥控制栏: 86标识 + 系统花名册 + 音乐歌词 + 日历, 连续毛玻璃底。对应 v5 HTML 预览。
Version=5.0.0
License=MIT

; ============================================================
;  MEASURES
; ============================================================

; ---- 系统监测 ----
[mCpu]
Measure=CPU
Processor=0

[mMem]
Measure=PhysicalMemory
UpdateDivider=2

[mDsk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
Percentual=1
UpdateDivider=30

[mGpuTemp]
; 占位: GPU 温度需 HWiNFO/CoreTemp 插件。无插件时显示 mem 派生占位。
Measure=Calc
Formula=54

[mNetIn]
Measure=NetIn
NetInSpeed=10485760

[mNetOut]
Measure=NetOut
NetOutSpeed=10485760

; ---- 时间 / 日历 ----
[mTimeMon]
Measure=Time
Format=%b
[mTimeMonU]
Measure=Time
Format=%b
; 大写月份用于显示
[mTimeYear]
Measure=Time
Format=%Y
[mTimeMonCN]
Measure=Time
Format=%m
Substitute="01":"一月","02":"二月","03":"三月","04":"四月","05":"五月","06":"六月","07":"七月","08":"八月","09":"九月","10":"十月","11":"十一月","12":"十二月"
[mDoY]
Measure=Time
Format=%j
[mYearProg]
; 年度进度 % = 当年已过天数 / 365
Measure=Calc
Formula=(mDoY / 365) * 100
DynamicVariables=1

; ---- 日历日期计算 (当月1号星期几 + 当月天数 + 今天) ----
[mDay]
Measure=Time
Format=%d
[mMonNum]
Measure=Time
Format=%m
[mFirstDow]
; 当月1号是星期几 (0=日)。用当前日期回推。
Measure=Time
Format=%w
; 简化: 实际月历排布由 Lua 生成更准, 此处先用静态 6 月布局占位 (见 meters)。

; ---- 音乐 (WebNowPlaying-Redux) ----
[mPlayer]
Measure=Plugin
Plugin=WebNowPlaying
PlayerName=mPlayer
; 若未装 WNP 插件, 以下子测量返回空, 显示占位文本。
[mTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerName=mPlayer
PlayerType=Title
[mArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerName=mPlayer
PlayerType=Artist
[mPos]
Measure=Plugin
Plugin=WebNowPlaying
PlayerName=mPlayer
PlayerType=Position
[mDur]
Measure=Plugin
Plugin=WebNowPlaying
PlayerName=mPlayer
PlayerType=Duration
[mProg]
Measure=Plugin
Plugin=WebNowPlaying
PlayerName=mPlayer
PlayerType=Progress

; ---- 进场动画: 整条栏淡入 ----
[mIntro]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat RailUp,16,18
RailUp=[!SetVariable RailAlpha "(Clamp(#RailAlpha#+16,0,255))"][!UpdateMeasure mIntro][!UpdateMeter mtrBg][!Redraw]
DynamicVariables=1

