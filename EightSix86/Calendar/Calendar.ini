; ============================================================
;  86 HUD · Calendar (Chronos)
;  3-row month stack (prev / current / next), right-aligned.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
@include=#@#Variables.inc

[Metadata]
Name=86 Calendar
Author=Dalwin
Information=Stacked-month calendar in Geometry-Rainmeter style. Top-right placement.
Version=1.0.0
License=MIT

; ============ MEASURES ============

[mNowTS]
Measure=Time
Format=%s

[mWeek]
Measure=Time
Format=%V

[mDoy]
Measure=Time
Format=%j

[mDay]
Measure=Time
Format=%d

[mCurMonth]
Measure=Time
Format=%b
StringCase=Upper

[mCurMonthNum]
Measure=Time
Format=%m

[mPrevMonth]
Measure=Time
TimeStamp=([mNowTS]-2592000)
DynamicVariables=1
Format=%b
StringCase=Upper

[mPrevMonthNum]
Measure=Time
TimeStamp=([mNowTS]-2592000)
DynamicVariables=1
Format=%m

[mNextMonth]
Measure=Time
TimeStamp=([mNowTS]+2592000)
DynamicVariables=1
Format=%b
StringCase=Upper

[mNextMonthNum]
Measure=Time
TimeStamp=([mNowTS]+2592000)
DynamicVariables=1
Format=%m

; ============ STYLES ============

[stHead]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1
StringAlign=Right

[stMonthDim]
FontFace=#FontFace#
FontSize=11
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringCase=Upper
StringStyle=Bold
AntiAlias=1
StringAlign=Right

[stMonthCur]
FontFace=#FontFace#
FontSize=14
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringCase=Upper
StringStyle=Bold
AntiAlias=1
StringAlign=Right

[stNumDim]
FontFace=#FontFace#
FontSize=12
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1
StringAlign=Left

[stNumCur]
FontFace=#FontFace#
FontSize=18
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1
StringAlign=Left

[stFootL]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1
StringAlign=Left

[stFootR]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1
StringAlign=Right

; ============ METERS ============
; Canvas: 170 × 124. Right edge x=170. Pip column at x=140. Number left-aligned x=146.

; Header
[mtrHead]
Meter=String
MeterStyle=stHead
MeasureName=mWeek
X=170
Y=4
Text=/ CHRONOS · WK-%1
LeftMouseUpAction=["explorer.exe" "shell:::{2DD03B2D-3DA8-4E07-AC02-EAE56E40A5DC}"]
ToolTipText=Click to open Calendar

[mtrHeadDivider]
Meter=Shape
X=0
Y=22
Shape=Line 0,0,170,0 | StrokeWidth 1 | Stroke Color #ColorCyanEdge#

; Row 1: Previous month (dim, top)
[mtrPrevMonth]
Meter=String
MeterStyle=stMonthDim
MeasureName=mPrevMonth
X=134
Y=27
Text=%1

[mtrPrevPip]
Meter=Shape
X=140
Y=29
Shape=Line 0,0,0,14 | StrokeWidth 1 | Stroke Color #ColorCyanDim#

[mtrPrevNum]
Meter=String
MeterStyle=stNumDim
MeasureName=mPrevMonthNum
X=148
Y=27
Text=%1

; Row 2: Current month (highlighted, larger)
[mtrCurMonth]
Meter=String
MeterStyle=stMonthCur
MeasureName=mCurMonth
X=134
Y=46
Text=%1

[mtrCurPip]
Meter=Shape
X=140
Y=46
Shape=Line 0,0,0,18 | StrokeWidth 1 | Stroke Color #ColorCyanEdge#

[mtrCurNum]
Meter=String
MeterStyle=stNumCur
MeasureName=mDay
X=148
Y=44
Text=%1

; Row 3: Next month (dim, bottom)
[mtrNextMonth]
Meter=String
MeterStyle=stMonthDim
MeasureName=mNextMonth
X=134
Y=70
Text=%1

[mtrNextPip]
Meter=Shape
X=140
Y=72
Shape=Line 0,0,0,14 | StrokeWidth 1 | Stroke Color #ColorCyanDim#

[mtrNextNum]
Meter=String
MeterStyle=stNumDim
MeasureName=mNextMonthNum
X=148
Y=70
Text=%1

; Footer divider
[mtrFootDivider]
Meter=Shape
X=0
Y=92
Shape=Line 0,0,170,0 | StrokeWidth 1 | Stroke Color #ColorCyanEdge#

; Footer
[mtrFootL]
Meter=String
MeterStyle=stFootL
MeasureName=mDoy
X=0
Y=98
Text=D-%1 / 365

[mtrFootR]
Meter=String
MeterStyle=stFootR
X=170
Y=98
Text=▼ TODAY
