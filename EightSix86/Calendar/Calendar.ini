; ============================================================
;  86 HUD · Calendar (Chronos)
;  3-row month stack (prev / current / next), right-aligned.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
@include=#@#Variables.inc

[Metadata]
Name=86 Calendar
Author=Dalwin
Information=Stacked-month calendar in Geometry-Rainmeter style. Top-right placement.
Version=1.1.0
License=MIT

; ============ MEASURES ============

[mNowTS]
Measure=Time
Format=%s

[mWeek]
Measure=Time
Format=%V

[mDoy]
Measure=Time
Format=%j

[mDay]
Measure=Time
Format=%d

[mCurMonth]
Measure=Time
Format=%b
StringCase=Upper

[mCurMonthNum]
Measure=Time
Format=%m

[mPrevMonth]
Measure=Time
TimeStamp=([mNowTS]-2592000)
DynamicVariables=1
Format=%b
StringCase=Upper

[mPrevMonthNum]
Measure=Time
TimeStamp=([mNowTS]-2592000)
DynamicVariables=1
Format=%m

[mNextMonth]
Measure=Time
TimeStamp=([mNowTS]+2592000)
DynamicVariables=1
Format=%b
StringCase=Upper

[mNextMonthNum]
Measure=Time
TimeStamp=([mNowTS]+2592000)
DynamicVariables=1
Format=%m

; ============ STYLES ============

[stHead]
FontFace=#FontFace#
FontSize=10
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1
StringAlign=Right

[stMonthDim]
FontFace=#FontFace#
FontSize=14
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringCase=Upper
StringStyle=Bold
AntiAlias=1
StringAlign=Right

[stMonthCur]
FontFace=#FontFace#
FontSize=18
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringCase=Upper
StringStyle=Bold
AntiAlias=1
StringAlign=Right

[stNumDim]
FontFace=#FontFace#
FontSize=15
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1
StringAlign=Left

[stNumCur]
FontFace=#FontFace#
FontSize=22
FontColor=#ColorRed#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1
StringAlign=Left

[stFootL]
FontFace=#FontFace#
FontSize=9
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1
StringAlign=Left

[stFootR]
FontFace=#FontFaceCN#
FontSize=10
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1
StringAlign=Right

; ============ METERS ============
; Canvas: 213 × 155. Right edge x=213. Pip column at x=175. Number left-aligned x=185.

; Header
[mtrHead]
Meter=String
MeterStyle=stHead
MeasureName=mWeek
X=213
Y=5
Text=/ CHRONOS · WK-%1
LeftMouseUpAction=["explorer.exe" "shell:::{2DD03B2D-3DA8-4E07-AC02-EAE56E40A5DC}"]
ToolTipText=点击打开日历

[mtrHeadDivider]
Meter=Shape
X=0
Y=28
Shape=Line 0,0,213,0 | StrokeWidth 1 | Stroke Color #ColorCyanEdge#

; Row 1: Previous month (dim, top)
[mtrPrevMonth]
Meter=String
MeterStyle=stMonthDim
MeasureName=mPrevMonth
X=168
Y=34
Text=%1

[mtrPrevPip]
Meter=Shape
X=175
Y=36
Shape=Line 0,0,0,18 | StrokeWidth 1 | Stroke Color #ColorCyanDim#

[mtrPrevNum]
Meter=String
MeterStyle=stNumDim
MeasureName=mPrevMonthNum
X=185
Y=34
Text=%1

; Row 2: Current month (highlighted, larger)
[mtrCurMonth]
Meter=String
MeterStyle=stMonthCur
MeasureName=mCurMonth
X=168
Y=58
Text=%1

[mtrCurPip]
Meter=Shape
X=175
Y=58
Shape=Line 0,0,0,22 | StrokeWidth 2 | Stroke Color #ColorRed#

[mtrCurNum]
Meter=String
MeterStyle=stNumCur
MeasureName=mDay
X=185
Y=55
Text=%1

; Row 3: Next month (dim, bottom)
[mtrNextMonth]
Meter=String
MeterStyle=stMonthDim
MeasureName=mNextMonth
X=168
Y=88
Text=%1

[mtrNextPip]
Meter=Shape
X=175
Y=90
Shape=Line 0,0,0,18 | StrokeWidth 1 | Stroke Color #ColorCyanDim#

[mtrNextNum]
Meter=String
MeterStyle=stNumDim
MeasureName=mNextMonthNum
X=185
Y=88
Text=%1

; Footer divider
[mtrFootDivider]
Meter=Shape
X=0
Y=118
Shape=Line 0,0,213,0 | StrokeWidth 1 | Stroke Color #ColorCyanEdge#

; Footer
[mtrFootL]
Meter=String
MeterStyle=stFootL
MeasureName=mDoy
X=0
Y=126
Text=D-%1 / 365

[mtrFootR]
Meter=String
MeterStyle=stFootR
X=213
Y=126
Text=▼ 今日
