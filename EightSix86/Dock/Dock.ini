; ============================================================
;  86 HUD · Folder Dock
;  5 launchers in a horizontal row, no background fill.
;  Each = SVG-shape Spearhead personal-mark + label + codename.
;
;  Marks (placeholders — replace with vector PNGs when available):
;    DEV   → UNDERTAKER (Shin)
;    DOC   → BLACK DOG  (Raiden)
;    GAME  → LAUGHING FOX (Theo)
;    MEDIA → GUN SNAKE  (Kurena)
;    BIN   → SNOW WITCH (Anju, red alert)
;
;  Launcher target paths are configured in @Resources/Variables.inc.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
@include=#@#Variables.inc

[Metadata]
Name=86 Dock
Author=Dalwin
Information=Spearhead Squadron personal-mark folder dock. 5 launchers, transparent.
Version=1.0.0
License=MIT

; ============ STYLES ============

[stLabel]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

[stLabelAlert]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorRedDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

[stCodename]
FontFace=#FontFace#
FontSize=7
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

[stCodenameAlert]
FontFace=#FontFace#
FontSize=7
FontColor=#ColorRedDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

; ============ METERS ============
; Canvas: 460 × 90
; 5 launchers, 60w each + 22px gap = 5*60+4*22 = 388. Centered with 36px side margin.
; Launcher X centers: 70, 152, 234, 316, 398

; ====================================================
;  L1 · UNDERTAKER (Shin) → DEV
;  Centered around x=70
; ====================================================

[mtrL1Mark]
Meter=Shape
X=44
Y=4
LeftMouseUpAction=["#DockDevPath#"]
ToolTipText=DEV / UNDERTAKER#CRLF#Click to open

; Skull
Shape=Ellipse 26,22,11,13 | StrokeWidth 1.4 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
; Eye sockets
Shape2=Ellipse 22,21,2,3 | StrokeWidth 0 | Fill Color #ColorCyanEdge#
Shape3=Ellipse 30,21,2,3 | StrokeWidth 0 | Fill Color #ColorCyanEdge#
; Nose triangle
Shape4=Path NosePath | StrokeWidth 0 | Fill Color #ColorCyanEdge#
NosePath=24,28 | LineTo 26,26 | LineTo 28,28 | ClosePath
; Teeth
Shape5=Path TeethPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
TeethPath=20,33 | LineTo 20,36 | MoveTo 23,33 | LineTo 23,36 | MoveTo 26,33 | LineTo 26,36 | MoveTo 29,33 | LineTo 29,36 | MoveTo 32,33 | LineTo 32,36
; Shovel handle + blade
Shape6=Path ShovelPath | StrokeWidth 1.2 | Stroke Color #ColorCyanEdge# | Fill Color 126,229,245,80
ShovelPath=42,8 | LineTo 46,12 | LineTo 44,14 | LineTo 42,40 | LineTo 46,44 | LineTo 42,46 | LineTo 38,44 | LineTo 40,40 | LineTo 38,14 | LineTo 36,12 | ClosePath

[mtrL1Lbl]
Meter=String
MeterStyle=stLabel
X=70
Y=68
Text=DEV

[mtrL1Code]
Meter=String
MeterStyle=stCodename
X=70
Y=80
Text=UNDERTAKER

; ====================================================
;  L2 · BLACK DOG (Raiden) → DOC
;  Centered around x=152
; ====================================================

[mtrL2Mark]
Meter=Shape
X=126
Y=4
LeftMouseUpAction=["#DockDocPath#"]
ToolTipText=DOC / BLACK DOG#CRLF#Click to open

; Wolf head pentagon
Shape=Path HeadPath | StrokeWidth 1.4 | Stroke Color #ColorCyanEdge# | Fill Color 126,229,245,40
HeadPath=26,8 | LineTo 18,14 | LineTo 14,22 | LineTo 16,40 | LineTo 26,46 | LineTo 36,40 | LineTo 38,22 | LineTo 34,14 | ClosePath
; Left ear
Shape2=Path EarLPath | StrokeWidth 1.4 | Stroke Color #ColorCyanEdge# | Fill Color 126,229,245,80
EarLPath=18,14 | LineTo 16,4 | LineTo 22,12 | ClosePath
; Right ear
Shape3=Path EarRPath | StrokeWidth 1.4 | Stroke Color #ColorCyanEdge# | Fill Color 126,229,245,80
EarRPath=34,14 | LineTo 36,4 | LineTo 30,12 | ClosePath
; Eyes (horizontal slashes)
Shape4=Path EyesPath | StrokeWidth 1.6 | Stroke Color #ColorCyanEdge#
EyesPath=18,24 | LineTo 22,24 | MoveTo 30,24 | LineTo 34,24
; Snout
Shape5=Path SnoutPath | StrokeWidth 1.2 | Stroke Color #ColorCyanEdge#
SnoutPath=26,30 | LineTo 26,38 | MoveTo 22,34 | LineTo 30,34
; Nose
Shape6=Ellipse 26,30,2,1.4 | StrokeWidth 0 | Fill Color #ColorCyanEdge#
; Fangs
Shape7=Path FangsPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 126,229,245,150
FangsPath=23,38 | LineTo 24,42 | LineTo 25,38 | MoveTo 27,38 | LineTo 28,42 | LineTo 29,38

[mtrL2Lbl]
Meter=String
MeterStyle=stLabel
X=152
Y=68
Text=DOC

[mtrL2Code]
Meter=String
MeterStyle=stCodename
X=152
Y=80
Text=BLACK DOG

; ====================================================
;  L3 · LAUGHING FOX (Theo) → GAME
;  Centered around x=234
; ====================================================

[mtrL3Mark]
Meter=Shape
X=208
Y=4
LeftMouseUpAction=["#DockGamePath#"]
ToolTipText=GAME / LAUGHING FOX#CRLF#Click to launch

; Fox face hex
Shape=Path FoxPath | StrokeWidth 1.4 | Stroke Color #ColorCyanEdge# | Fill Color 126,229,245,40
FoxPath=26,8 | LineTo 14,14 | LineTo 8,10 | LineTo 12,22 | LineTo 14,34 | LineTo 26,42 | LineTo 38,34 | LineTo 40,22 | LineTo 44,10 | LineTo 38,14 | ClosePath
; Left cheek triangle
Shape2=Path CheekL | StrokeWidth 0 | Fill Color 126,229,245,100
CheekL=18,18 | LineTo 15,14 | LineTo 17,22 | ClosePath
; Right cheek triangle
Shape3=Path CheekR | StrokeWidth 0 | Fill Color 126,229,245,100
CheekR=34,18 | LineTo 37,14 | LineTo 35,22 | ClosePath
; Left eye (slanted)
Shape4=Path EyeL | StrokeWidth 0 | Fill Color #ColorCyanEdge#
EyeL=16,22 | LineTo 22,20 | LineTo 22,24 | ClosePath
; Right eye (slanted)
Shape5=Path EyeR | StrokeWidth 0 | Fill Color #ColorCyanEdge#
EyeR=36,22 | LineTo 30,20 | LineTo 30,24 | ClosePath
; Big grin curve
Shape6=Path Grin | StrokeWidth 1.5 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
Grin=13,28 | CurveTo 26,38,18,33,34,33 | LineTo 39,28
; Nose
Shape7=Ellipse 26,26,1.2 | StrokeWidth 0 | Fill Color #ColorCyanEdge#

[mtrL3Lbl]
Meter=String
MeterStyle=stLabel
X=234
Y=68
Text=GAME

[mtrL3Code]
Meter=String
MeterStyle=stCodename
X=234
Y=80
Text=LAUGHING FOX

; ====================================================
;  L4 · GUN SNAKE (Kurena) → MEDIA
;  Centered around x=316
; ====================================================

[mtrL4Mark]
Meter=Shape
X=290
Y=4
LeftMouseUpAction=["#DockMediaPath#"]
ToolTipText=MEDIA / GUN SNAKE#CRLF#Click to open

; Snake body S-curve
Shape=Path SnakePath | StrokeWidth 1.6 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
SnakePath=8,38 | CurveTo 12,22,4,30,12,18 | CurveTo 28,26,22,18,28,22 | CurveTo 24,36,32,30,16,38
; Snake head
Shape2=Ellipse 22,26,3,2 | StrokeWidth 0 | Fill Color #ColorCyanEdge#
; Tongue
Shape3=Path TonguePath | StrokeWidth 0.8 | Stroke Color #ColorCyanEdge#
TonguePath=22,24 | LineTo 18,22 | MoveTo 22,24 | LineTo 20,20
; Rifle barrel
Shape4=Path RiflePath | StrokeWidth 1.2 | Stroke Color #ColorCyanEdge# | Fill Color 126,229,245,80
RiflePath=32,16 | LineTo 44,12 | LineTo 44,14 | LineTo 32,18 | ClosePath
; Stock
Shape5=Path StockPath | StrokeWidth 1.2 | Stroke Color #ColorCyanEdge# | Fill Color 126,229,245,80
StockPath=30,18 | LineTo 26,24 | LineTo 28,26 | LineTo 32,22 | ClosePath
; Trigger guard
Shape6=Ellipse 32,20,2 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0

[mtrL4Lbl]
Meter=String
MeterStyle=stLabel
X=316
Y=68
Text=MEDIA

[mtrL4Code]
Meter=String
MeterStyle=stCodename
X=316
Y=80
Text=GUN SNAKE

; ====================================================
;  L5 · SNOW WITCH (Anju) → BIN  (red alert color)
;  Centered around x=398
; ====================================================

[mtrL5Mark]
Meter=Shape
X=372
Y=4
LeftMouseUpAction=["explorer.exe" "#DockBinPath#"]
RightMouseUpAction=[!CommandMeasure mBinEmpty "EmptyBin"]
ToolTipText=BIN / SNOW WITCH#CRLF#Left: open#CRLF#Right: empty

; Hat triangle
Shape=Path HatPath | StrokeWidth 1.4 | Stroke Color #ColorRedDim# | Fill Color 255,82,82,80
HatPath=26,4 | LineTo 16,22 | LineTo 36,22 | ClosePath
; Hat band
Shape2=Path BandPath | StrokeWidth 0 | Fill Color 255,82,82,120
BandPath=14,22 | LineTo 38,22 | LineTo 38,26 | LineTo 14,26 | ClosePath
; Skull face
Shape3=Ellipse 26,34,10,11 | StrokeWidth 1.4 | Stroke Color #ColorRedDim# | Fill Color 0,0,0,0
; Eye sockets
Shape4=Ellipse 22,32,2,2.6 | StrokeWidth 0 | Fill Color #ColorRedDim#
Shape5=Ellipse 30,32,2,2.6 | StrokeWidth 0 | Fill Color #ColorRedDim#
; Nose
Shape6=Path WitchNose | StrokeWidth 0 | Fill Color #ColorRedDim#
WitchNose=25,38 | LineTo 26,36 | LineTo 27,38 | ClosePath
; Jaw teeth
Shape7=Path WitchTeeth | StrokeWidth 0.9 | Stroke Color #ColorRedDim#
WitchTeeth=20,42 | LineTo 21,44 | MoveTo 23,42 | LineTo 23,45 | MoveTo 26,42 | LineTo 26,45 | MoveTo 29,42 | LineTo 29,45 | MoveTo 32,42 | LineTo 31,44
; Snowflake decoration
Shape8=Path Flake | StrokeWidth 0.8 | Stroke Color #ColorRedDim#
Flake=26,12 | LineTo 26,16 | MoveTo 24,14 | LineTo 28,14

; Recycle bin empty hook (used by right-click)
[mBinEmpty]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Count
UpdateDivider=10

[mtrL5Lbl]
Meter=String
MeterStyle=stLabelAlert
X=398
Y=68
Text=BIN

[mtrL5Code]
Meter=String
MeterStyle=stCodenameAlert
X=398
Y=80
Text=SNOW WITCH
