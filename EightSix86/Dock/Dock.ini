; ============================================================
;  86 HUD · Spearhead Crest Dock  (v5 — 成员纹章)
;  5 个圆环纹章 (非文件夹方块, 非抽象机甲):
;    SPH-01 UNDERTAKER   骷髅骑士 (颅骨+持剑+斗篷+镰刃横扫)
;    SPH-02 BLACK DOG    獠牙犬首
;    SPH-03 GUN SNAKE    蛇缠枪管 + 狙击准星
;    SPH-04 LAUGHING FOX 尖耳狐面
;    SPH-05 SNOW WITCH   六芒雪结晶
;  每个 = 圆环(实线+内虚线) + 线稿徽记 + 名称 + 编号。
;  hover: 上移 9px + 纹章/环点亮猩红 + 红辉光。
;  对应 v5 预览底部 dock。Shape 路径据 v5 SVG (viewBox 48) ×缩放重绘。
;
;  画布: 760 × 110。部署: 底部居中于右侧留白区。
;  5 格中心 X: 80, 240, 400, 560, 720 (格距 160)。纹章直径 58。
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc

[Variables]
; 每纹章 hover 态: Mk=线色, Ty=纵向偏移(idle 0→hover -9), Rg=环色, Gl=辉光alpha
C1Mk=#ColorIce#
C2Mk=#ColorIce#
C3Mk=#ColorIce#
C4Mk=#ColorIce#
C5Mk=#ColorIce#
C1Ty=0
C2Ty=0
C3Ty=0
C4Ty=0
C5Ty=0
C1Rg=141,166,196,80
C2Rg=141,166,196,80
C3Rg=141,166,196,80
C4Rg=141,166,196,80
C5Rg=141,166,196,80

[Metadata]
Name=86 Spearhead Crest Dock
Author=Dalwin
Information=v5 成员纹章 dock。5 个圆环纹章 (Undertaker/Black Dog/Gun Snake/Laughing Fox/Snow Witch), hover 上移+猩红点亮。
Version=5.0.0
License=MIT

; ============ STYLES ============
[stCrestLbl]
FontFile=#FontFileDisplayB#
FontFace=#FontFace#
FontSize=8
FontColor=#ColorIce#
StringStyle=Bold
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1
[stCrestId]
FontFile=#FontFileData#
FontFace=#FontFaceData#
FontSize=7
FontColor=#ColorSteel#
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

; ============================================================
;  C1 · UNDERTAKER (中心 x=80)  纹章框 x=51..109, y=#C1Ty#..58
; ============================================================
; 圆环 (实线外环 + 内虚线感: 用两个椭圆近似)
[mtrC1Ring]
Meter=Shape
X=51
Y=#C1Ty#
DynamicVariables=1
LeftMouseUpAction=["#DockUndertakerPath#"]
MouseOverAction=[!SetVariable C1Mk "#ColorRed#"][!SetVariable C1Ty "-9"][!SetVariable C1Rg "255,90,80,200"][!UpdateMeterGroup g1][!Redraw]
MouseLeaveAction=[!SetVariable C1Mk "#ColorIce#"][!SetVariable C1Ty "0"][!SetVariable C1Rg "141,166,196,80"][!UpdateMeterGroup g1][!Redraw]
ToolTipText=UNDERTAKER / SPH-01#CRLF#Shin · 点击打开
Shape=Ellipse 29,29,28 | StrokeWidth 1 | Stroke Color #C1Rg# | Fill Color 0,0,0,0
Shape2=Ellipse 29,29,24 | StrokeWidth 1 | Stroke Color 141,166,196,40
Group=g1
; 纹章线稿 (viewBox 48 → 缩放至 ~40, 偏移到环心: +9,+9)
[mtrC1Mk]
Meter=Shape
X=60
Y=(#C1Ty#+9)
DynamicVariables=1
; 斗篷剪影 (填充)
Shape=Path Cape | StrokeWidth 0 | Fill Color #C1Mk#
Cape=22,17 | CurveTo 33,39,39,24,33,39 | CurveTo 27,26,31,34,27,26 | ClosePath
; 颅骨
Shape2=Ellipse 20,15,4 | StrokeWidth 1.6 | Stroke Color #C1Mk# | Fill Color 0,0,0,0
Shape3=Ellipse 18.6,15,1 | StrokeWidth 0 | Fill Color #C1Mk#
; 脊柱
Shape4=Path Spine | StrokeWidth 1.6 | Stroke Color #C1Mk#
Spine=20,19 | LineTo 20,33
; 肋骨 (三段)
Shape5=Path Ribs | StrokeWidth 1.3 | Stroke Color #C1Mk# | Fill Color 0,0,0,0
Ribs=20,23 | CurveTo 16.5,25.5,16.5,23,16.5,25.5 | MoveTo 20,26.5 | CurveTo 16,29,15.5,26.5,16,29 | MoveTo 20,30 | CurveTo 17,31.8,16.5,30,17,31.8
; 剑 (粗刃 + 护手)
Shape6=Path Sword | StrokeWidth 2.4 | Stroke Color #C1Mk#
Sword=32,6 | LineTo 23.5,16
Shape7=Path Guard | StrokeWidth 1.6 | Stroke Color #C1Mk#
Guard=27.5,9.5 | LineTo 31.5,13
; 持剑骨臂
Shape8=Path Arm | StrokeWidth 1.6 | Stroke Color #C1Mk# | Fill Color 0,0,0,0
Arm=20,21 | CurveTo 27.5,16,25.5,18.5,27.5,16
; 镰刃横扫
Shape9=Path Scythe | StrokeWidth 2.2 | Stroke Color #C1Mk# | Fill Color 0,0,0,0
Scythe=9,41 | CurveTo 40,41,30,33.5,40,41
Group=g1
[mtrC1Lbl]
Meter=String
MeterStyle=stCrestLbl
X=80
Y=76
Text=Undertaker
Group=g1
[mtrC1Id]
Meter=String
MeterStyle=stCrestId
X=80
Y=92
Text=SPH-01
Group=g1

