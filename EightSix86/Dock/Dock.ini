; ============================================================
;  86 HUD · Folder Dock
;  5 launchers in a horizontal row, no background fill.
;  Each = SVG-shape Spearhead personal-mark + label + codename.
;
;  Marks (placeholders — replace with vector PNGs when available):
;    DEV   → UNDERTAKER (Shin)
;    DOC   → BLACK DOG  (Raiden)
;    GAME  → LAUGHING FOX (Theo)
;    MEDIA → GUN SNAKE  (Kurena)
;    BIN   → SNOW WITCH (Anju, red alert)
;
;  Launcher target paths are configured in @Resources/Variables.inc.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
@include=#@#Variables.inc

[Metadata]
Name=86 Dock
Author=Dalwin
Information=Spearhead Squadron personal-mark folder dock. 5 launchers, transparent. Hover lifts the mark, brightens its stroke, and floats corner ticks.
Version=1.1.0
License=MIT

; ---- Per-launcher hover state (merged with global [Variables]) ----
; L*Mk  = mark stroke color (idle = blue edge / red for BIN; hover = bright)
; L*Ty  = mark vertical offset (idle 4 -> hover 1, the -3px lift)
; L*Tk  = corner-tick alpha (idle 0 -> hover 255)
[Variables]
L1Mk=30,90,200,242
L2Mk=30,90,200,242
L3Mk=30,90,200,242
L4Mk=30,90,200,242
L5Mk=200,30,58,150
L1Ty=4
L2Ty=4
L3Ty=4
L4Ty=4
L5Ty=4
L1Tk=0
L2Tk=0
L3Tk=0
L4Tk=0
L5Tk=0

; ============ STYLES ============

[stLabel]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

[stLabelAlert]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorRedDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

[stCodename]
FontFace=#FontFace#
FontSize=7
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

[stCodenameAlert]
FontFace=#FontFace#
FontSize=7
FontColor=#ColorRedDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

; ============ METERS ============
; Canvas: 460 × 90
; 5 launchers, 60w each + 22px gap = 5*60+4*22 = 388. Centered with 36px side margin.
; Launcher X centers: 70, 152, 234, 316, 398

; ====================================================
;  L1 · UNDERTAKER (Shin) → DEV
;  Centered around x=70
; ====================================================

[mtrL1Mark]
Meter=Shape
X=44
Y=#L1Ty#
DynamicVariables=1
LeftMouseUpAction=["#DockDevPath#"]
MouseOverAction=[!SetVariable L1Mk "#ColorText#"][!SetVariable L1Ty "1"][!SetVariable L1Tk "255"][!UpdateMeter mtrL1Mark][!UpdateMeterGroup g1][!Redraw]
MouseLeaveAction=[!SetVariable L1Mk "#ColorCyanEdge#"][!SetVariable L1Ty "4"][!SetVariable L1Tk "0"][!UpdateMeter mtrL1Mark][!UpdateMeterGroup g1][!Redraw]
ToolTipText=DEV / UNDERTAKER#CRLF#Click to open

; Skull
Shape=Ellipse 26,22,11,13 | StrokeWidth 1.4 | Stroke Color #L1Mk# | Fill Color 0,0,0,0
; Eye sockets
Shape2=Ellipse 22,21,2,3 | StrokeWidth 0 | Fill Color #L1Mk#
Shape3=Ellipse 30,21,2,3 | StrokeWidth 0 | Fill Color #L1Mk#
; Nose triangle
Shape4=Path NosePath | StrokeWidth 0 | Fill Color #L1Mk#
NosePath=24,28 | LineTo 26,26 | LineTo 28,28 | ClosePath
; Teeth
Shape5=Path TeethPath | StrokeWidth 1 | Stroke Color #L1Mk# | Fill Color 0,0,0,0
TeethPath=20,33 | LineTo 20,36 | MoveTo 23,33 | LineTo 23,36 | MoveTo 26,33 | LineTo 26,36 | MoveTo 29,33 | LineTo 29,36 | MoveTo 32,33 | LineTo 32,36
; Shovel handle + blade
Shape6=Path ShovelPath | StrokeWidth 1.2 | Stroke Color #L1Mk# | Fill Color 30,90,200,80
ShovelPath=42,8 | LineTo 46,12 | LineTo 44,14 | LineTo 42,40 | LineTo 46,44 | LineTo 42,46 | LineTo 38,44 | LineTo 40,40 | LineTo 38,14 | LineTo 36,12 | ClosePath

; Hover corner ticks (float in on MouseOver via L1Tk alpha)
[mtrL1Tick]
Meter=Shape
X=40
Y=0
DynamicVariables=1
Shape=Path tl | StrokeWidth 1 | Stroke Color 30,90,200,#L1Tk#
tl=0,7 | LineTo 0,0 | LineTo 7,0
Shape2=Path tr | StrokeWidth 1 | Stroke Color 30,90,200,#L1Tk#
tr=53,0 | LineTo 60,0 | LineTo 60,7
Shape3=Path bl | StrokeWidth 1 | Stroke Color 30,90,200,#L1Tk#
bl=0,53 | LineTo 0,60 | LineTo 7,60
Shape4=Path br | StrokeWidth 1 | Stroke Color 30,90,200,#L1Tk#
br=60,53 | LineTo 60,60 | LineTo 53,60
Group=g1

[mtrL1Lbl]
Meter=String
MeterStyle=stLabel
X=70
Y=68
Text=DEV
Group=g1

[mtrL1Code]
Meter=String
MeterStyle=stCodename
X=70
Y=80
Text=UNDERTAKER
Group=g1

