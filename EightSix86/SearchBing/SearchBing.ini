; ============================================================
;  86 HUD · Search · BING
;  Long horizontal row: [B] BING ▶ [______input______] [DISPATCH ⏎]
;  Mirror of SearchGoogle, only differs in glyph / name / URL.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
@include=#@#Variables.inc

[Metadata]
Name=86 Search · Bing
Author=Dalwin
Information=Quick-search bar for Bing. Click input area to type, Enter to dispatch.
Version=1.0.0
License=MIT

; ============ MEASURES ============

[mInput]
Measure=Plugin
Plugin=InputText
SolidColor=0,0,0,1
StringStyle=Bold
StringAlign=LeftCenter
FontFace=#FontFace#
FontSize=10
FontColor=#ColorText#
AntiAlias=1
DefaultValue=""
FocusDismiss=1
Command1=["https://www.bing.com/search?q=$UserInput$"]
X=130
Y=14
W=300
H=20
UpdateDivider=86400

; ============ STYLES ============

[stGlyph]
FontFace=#FontFace#
FontSize=12
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringAlign=CenterCenter
AntiAlias=1

[stName]
FontFace=#FontFace#
FontSize=9
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[stArrow]
FontFace=#FontFace#
FontSize=10
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
AntiAlias=1

[stPlaceholder]
FontFace=#FontFace#
FontSize=10
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
AntiAlias=1

[stDispatch]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
StringAlign=CenterCenter
AntiAlias=1

; ============ METERS ============
; Canvas: 540 × 40

[mtrCornerTL]
Meter=Shape
X=0
Y=0
Shape=Path tlPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
tlPath=0,11 | LineTo 0,0 | LineTo 11,0

[mtrCornerTR]
Meter=Shape
X=529
Y=0
Shape=Path trPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
trPath=0,0 | LineTo 11,0 | LineTo 11,11

[mtrCornerBL]
Meter=Shape
X=0
Y=29
Shape=Path blPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
blPath=0,0 | LineTo 0,11 | LineTo 11,11

[mtrCornerBR]
Meter=Shape
X=529
Y=29
Shape=Path brPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
brPath=11,0 | LineTo 11,11 | LineTo 0,11

[mtrGlyphBox]
Meter=Shape
X=18
Y=11
Shape=Rectangle 0,0,20,20 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0

[mtrGlyph]
Meter=String
MeterStyle=stGlyph
X=28
Y=21
Text=B

[mtrName]
Meter=String
MeterStyle=stName
X=46
Y=14
Text=BING

[mtrArrow]
Meter=String
MeterStyle=stArrow
X=110
Y=14
Text=▶

[mtrInputLine]
Meter=Shape
X=128
Y=33
Shape=Line 0,0,310,0 | StrokeWidth 1 | Stroke Color #ColorCyanEdge#

[mtrPlaceholder]
Meter=String
MeterStyle=stPlaceholder
X=130
Y=14
Text=search query · bing.com
LeftMouseUpAction=[!CommandMeasure mInput "ExecuteBatch 1"]
ToolTipText=Click and type — Enter to dispatch to Bing

[mtrDispatchBox]
Meter=Shape
X=460
Y=11
Shape=Rectangle 0,0,72,20 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0

[mtrDispatch]
Meter=String
MeterStyle=stDispatch
X=496
Y=21
Text=DISPATCH ⏎
LeftMouseUpAction=[!CommandMeasure mInput "ExecuteBatch 1"]
