; ============================================================
;  86 HUD · Clock
;  Center main-visual: HH:MM:SS large digits + Chinese date.
;  Two diamond endpoints flank left/right.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
DefaultUpdateDivider=1
@include=#@#Variables.inc

[Metadata]
Name=86 Clock
Author=Dalwin
Information=Center clock — main visual element of the 86 HUD theme.
Version=1.1.0
License=MIT

; ============ MEASURES ============

[mTime]
Measure=Time
Format=%H:%M:%S

[mWeekday]
Measure=Time
Format=%w
Substitute="0":"星期日","1":"星期一","2":"星期二","3":"星期三","4":"星期四","5":"星期五","6":"星期六"

[mDateCN]
Measure=Time
Format=%Y年%m月%d日

[mDoY]
Measure=Time
Format=%j

; ============ STYLES ============

[stDigits]
StringAlign=CenterCenter
FontFace=#FontFaceLight#
FontSize=96
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
AntiAlias=1
ClipString=0
InlineSetting=Color | #ColorCyan#
InlinePattern=:

[stDateCN]
StringAlign=CenterCenter
FontFace=#FontFaceCN#
FontSize=16
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1

[stDoy]
StringAlign=LeftCenter
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[stDoyCN]
StringAlign=LeftCenter
FontFace=#FontFaceCN#
FontSize=9
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1

; ============ METERS ============
; Skin canvas: 720 x 220. Center at X=360.

; Left diamond endpoint
[mtrDiamondL]
Meter=Shape
X=8
Y=88
Shape=Rectangle 0,0,18,18 | Rotate 45,9,9 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color #ColorPanel#

; Right diamond endpoint
[mtrDiamondR]
Meter=Shape
X=694
Y=88
Shape=Rectangle 0,0,18,18 | Rotate 45,9,9 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color #ColorPanel#

; Big digits HH:MM:SS — colon auto-tinted cyan via InlineSetting
[mtrDigits]
Meter=String
MeasureName=mTime
MeterStyle=stDigits
X=360
Y=98
W=680
H=140
Text=%1
LeftMouseUpAction=["explorer.exe" "shell:::{05D7B0F4-2121-4EFF-BF6B-ED3F69B894D9}"]
ToolTipText=点击：打开 Windows 时钟设置

; Chinese full date — 星期X · YYYY年M月D日
[mtrDateCN]
Meter=String
MeasureName=mWeekday
MeasureName2=mDateCN
MeterStyle=stDateCN
X=360
Y=170
W=680
H=22
Text=%1   ·   %2

; Day-of-year — 第N天 / 365
[mtrDoyCN]
Meter=String
MeasureName=mDoY
MeterStyle=stDoyCN
X=160
Y=200
W=120
H=14
Text=第 %1 天 / 365

; Cyan→transparent gradient scan line
[mtrScan]
Meter=Shape
X=290
Y=199
Shape=Line 0,3,260,3 | StrokeWidth 1 | Stroke LinearGradient ScanGrad
ScanGrad=0 | #ColorCyanEdge# ; 0.0 | 126,229,245,0 ; 1.0
