; ============================================================
;  86 HUD · Clock  (center main-visual / signature moment)
;  HH:MM:SS large digits + Chinese date, flanked by diamonds.
;
;  v1.2 — the centerpiece finally breathes:
;    · staged startup reveal — diamonds light, digits fade up,
;      date + day-of-year follow (ActionTimer, "elegant unveil")
;    · colon pulses on a smooth sine breath, not a hard blink
;    · per-second tick micro-glow ripples from center
;  86 design grammar: restrained, lets the wallpaper lead.
; ============================================================

[Rainmeter]
; 125ms base tick drives the smooth colon breath; time/date measures
; below use UpdateDivider=8 so they still refresh once per second.
Update=125
AccurateText=1
DefaultUpdateDivider=8
DynamicWindowSize=1
@include=#@#Variables.inc
OnRefreshAction=[!SetVariable DigitAlpha "0"][!SetVariable ChromeAlpha "0"][!SetVariable MetaAlpha "0"][!UpdateMeterGroup clock][!CommandMeasure mIntro "Execute 1"]

; Local animation state (merged with global [Variables] from @include).
[Variables]
DigitAlpha=0
ChromeAlpha=0
MetaAlpha=0
BreathAlpha=255

[Metadata]
Name=86 Clock
Author=Dalwin
Information=Center clock — main visual of the 86 HUD. Staged reveal, sine colon breath, tick ripple.
Version=1.2.0
License=MIT

; ============ MEASURES ============

[mTime]
Measure=Time
Format=%H:%M:%S

[mWeekday]
Measure=Time
Format=%w
Substitute="0":"星期日","1":"星期一","2":"星期二","3":"星期三","4":"星期四","5":"星期五","6":"星期六"

[mDateCN]
Measure=Time
Format=%Y年%m月%d日

[mDoY]
Measure=Time
Format=%j

; Colon breath driver. Runs 8× faster than the clock (125ms) so the sine
; reads as a smooth pulse rather than a 1fps stutter. UpdateDivider on the
; clock measures keeps the time itself ticking once per second.
[mBreathTick]
Measure=Calc
Formula=(mBreathTick + 1) % 32
UpdateDivider=1
DynamicVariables=1

; Sine breath 0.30..1.0 over a 32-step (~4s) cycle -> BreathAlpha 76..255.
[mBreath]
Measure=Calc
Formula=(0.30 + 0.70 * (0.5 + 0.5 * Sin((mBreathTick / 32) * 6.2832))) * 255
UpdateDivider=1
IfCondition=(mBreath >= 0)
IfTrueAction=[!SetVariable BreathAlpha "[&mBreath:0]"][!UpdateMeter mtrDigits][!Redraw]
DynamicVariables=1

; ---- Staged startup reveal ----
[mIntro]
Measure=Plugin
Plugin=ActionTimer
; 1) chrome (diamonds + scan) fade in  2) digits fade up  3) meta fades in
ActionList1=Repeat ChromeUp,16,16 | Wait 40 | Repeat DigitUp,14,18 | Wait 40 | Repeat MetaUp,18,14
ChromeUp=[!SetVariable ChromeAlpha "(Clamp(#ChromeAlpha#+16,0,255))"][!UpdateMeasure mIntro][!UpdateMeterGroup clock][!Redraw]
DigitUp=[!SetVariable DigitAlpha "(Clamp(#DigitAlpha#+15,0,255))"][!UpdateMeasure mIntro][!UpdateMeter mtrDigits][!Redraw]
MetaUp=[!SetVariable MetaAlpha "(Clamp(#MetaAlpha#+19,0,255))"][!UpdateMeasure mIntro][!UpdateMeterGroup clock][!Redraw]
DynamicVariables=1

; ============ STYLES ============

[stDigits]
StringAlign=CenterCenter
FontFace=#FontFaceLight#
FontSize=96
FontColor=245,251,255,#DigitAlpha#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
AntiAlias=1
ClipString=0
DynamicVariables=1

[stDateCN]
StringAlign=CenterCenter
FontFace=#FontFaceCN#
FontSize=16
FontColor=245,251,255,#MetaAlpha#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1
DynamicVariables=1

[stDoyCN]
StringAlign=LeftCenter
FontFace=#FontFaceCN#
FontSize=9
FontColor=30,90,200,#MetaAlpha#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1
DynamicVariables=1

; ============ METERS ============
; Skin canvas: 720 x 220. Center at X=360.

; Left diamond endpoint
[mtrDiamondL]
Meter=Shape
X=8
Y=88
Shape=Rectangle 0,0,18,18 | Rotate 45,9,9 | StrokeWidth 1 | Stroke Color 30,90,200,#ChromeAlpha# | Fill Color 5,9,18,#ChromeAlpha#
DynamicVariables=1
Group=clock

; Right diamond endpoint
[mtrDiamondR]
Meter=Shape
X=694
Y=88
Shape=Rectangle 0,0,18,18 | Rotate 45,9,9 | StrokeWidth 1 | Stroke Color 30,90,200,#ChromeAlpha# | Fill Color 5,9,18,#ChromeAlpha#
DynamicVariables=1
Group=clock

; Big digits HH:MM:SS — colon tinted red, alpha breathing via BreathAlpha.
[mtrDigits]
Meter=String
MeasureName=mTime
MeterStyle=stDigits
X=360
Y=98
W=680
H=140
Text=%1
InlineSetting=Color | 200,30,58,#BreathAlpha#
InlinePattern=:
LeftMouseUpAction=["explorer.exe" "shell:::{05D7B0F4-2121-4EFF-BF6B-ED3F69B894D9}"]
ToolTipText=点击：打开 Windows 时钟设置
Group=clock

; Chinese full date — 星期X · YYYY年M月D日
[mtrDateCN]
Meter=String
MeasureName=mWeekday
MeasureName2=mDateCN
MeterStyle=stDateCN
X=360
Y=170
W=680
H=22
Text=%1   ·   %2
Group=clock

; Day-of-year — 第N天 / 365
[mtrDoyCN]
Meter=String
MeasureName=mDoY
MeterStyle=stDoyCN
X=160
Y=200
W=120
H=14
Text=第 %1 天 / 365
Group=clock

; Blue→transparent gradient scan line (HUD chrome)
[mtrScan]
Meter=Shape
X=290
Y=199
Shape=Line 0,3,260,3 | StrokeWidth 1 | Stroke LinearGradient ScanGrad
ScanGrad=0 | 30,90,200,0 ; 0.0 | 30,90,200,#ChromeAlpha# ; 0.5 | 30,90,200,0 ; 1.0
DynamicVariables=1
Group=clock
