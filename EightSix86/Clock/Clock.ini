; ============================================================
;  86 HUD · Clock
;  Center main-visual: HH:MM:SS large digits + day/date + scan
;  Two diamond endpoints flank left/right.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
DefaultUpdateDivider=1
@include=#@#Variables.inc

[Metadata]
Name=86 Clock
Author=Dalwin
Information=Center clock — main visual element of the 86 HUD theme.
Version=1.0.0
License=MIT

; ============ MEASURES ============

[mTime]
Measure=Time
Format=%H:%M:%S

[mDay]
Measure=Time
Format=%a
StringCase=Upper

[mDate]
Measure=Time
Format=%d · %b · %Y
StringCase=Upper

[mDoY]
Measure=Time
Format=%j

; ============ STYLES ============

[stDigits]
StringAlign=CenterCenter
FontFace=#FontFaceLight#
FontSize=64
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
AntiAlias=1
ClipString=0
InlineSetting=Color | #ColorCyan#
InlinePattern=:

[stMeta]
StringAlign=CenterCenter
FontFace=#FontFace#
FontSize=10
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[stDay]
StringAlign=CenterCenter
FontFace=#FontFace#
FontSize=12
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[stTNum]
StringAlign=LeftCenter
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

; ============ METERS ============
; Skin canvas: 600 x 180. Center at X=300.

; Left diamond endpoint (rotated 14×14 square)
[mtrDiamondL]
Meter=Shape
X=8
Y=66
Shape=Rectangle 0,0,14,14 | Rotate 45,7,7 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color #ColorPanel#

; Right diamond endpoint
[mtrDiamondR]
Meter=Shape
X=578
Y=66
Shape=Rectangle 0,0,14,14 | Rotate 45,7,7 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color #ColorPanel#

; Big digits HH:MM:SS — colon auto-tinted cyan via InlineSetting
[mtrDigits]
Meter=String
MeasureName=mTime
MeterStyle=stDigits
X=300
Y=72
W=520
H=110
Text=%1
LeftMouseUpAction=["explorer.exe" "shell:::{05D7B0F4-2121-4EFF-BF6B-ED3F69B894D9}"]
ToolTipText=Click: open Windows clock settings

; Day · separator · date  (single line, separator emulated with em-dash)
[mtrDay]
Meter=String
MeasureName=mDay
MeasureName2=mDate
MeterStyle=stDay
X=300
Y=132
W=520
H=18
Text=%1   —   %2

; T-001 day-of-year code + scan line to its right
[mtrTNum]
Meter=String
MeasureName=mDoY
MeterStyle=stTNum
X=180
Y=160
W=70
H=14
Text=/ T-%1

; Cyan→transparent gradient scan line beside T-001
[mtrScan]
Meter=Shape
X=250
Y=159
Shape=Line 0,3,200,3 | StrokeWidth 1 | Stroke LinearGradient ScanGrad
ScanGrad=0 | #ColorCyanEdge# ; 0.0 | 126,229,245,0 ; 1.0
