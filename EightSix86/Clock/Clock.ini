; ============================================================
;  86 HUD · CHRONOS Clock  (v5 中央主视觉 — 纯白)
;  对应 v5 预览中央时钟:
;    · CHRONOS — WEEK NN  meta (菱形+横线 flank)
;    · 150px 纯白大字 HH:MM, 冒号纯白呼吸闪烁, 秒数小号上标
;    · 上下扫描框
;    · SUN · JUN 14 2026   星期日
;    · SYSTEM NOMINAL · D-NNN / 365 状态条
;  v5 纠正: 时钟字体全部纯白(含冒号), 不要红白蓝多色。
;
;  画布: 600 × 380。部署: 居中于右侧留白区
;    (屏幕宽 W: X = 312 + (W-312)/2 - 300; Y 居中略偏上)。
; ============================================================

[Rainmeter]
Update=125
AccurateText=1
DefaultUpdateDivider=8
DynamicWindowSize=1
@include=#@#Variables.inc
OnRefreshAction=[!SetVariable DigitAlpha "0"][!SetVariable ChromeAlpha "0"][!SetVariable MetaAlpha "0"][!CommandMeasure mIntro "Execute 1"]

[Variables]
DigitAlpha=0
ChromeAlpha=0
MetaAlpha=0
ColonAlpha=255

[Metadata]
Name=86 Chronos Clock
Author=Dalwin
Information=v5 中央主视觉时钟。纯白大字, 白色呼吸冒号, 扫描框, 中文星期, 系统状态条。
Version=5.0.0
License=MIT

; ============ MEASURES ============

[mTimeHM]
Measure=Time
Format=%H:%M
[mSec]
Measure=Time
Format=%S
[mWeek]
; 一年中的第几周
Measure=Time
Format=%U
[mWeekday]
Measure=Time
Format=%w
Substitute="0":"星期日","1":"星期一","2":"星期二","3":"星期三","4":"星期四","5":"星期五","6":"星期六"
[mDateEN]
Measure=Time
Format=%a · %b %d %Y
[mDoY]
Measure=Time
Format=%j

; 冒号呼吸 (纯白, alpha 76..255 正弦, 32 步 ~4s)
[mBreathTick]
Measure=Calc
Formula=(mBreathTick + 1) % 32
UpdateDivider=1
DynamicVariables=1
[mBreath]
Measure=Calc
Formula=(0.30 + 0.70 * (0.5 + 0.5 * Sin((mBreathTick / 32) * 6.2832))) * 255
UpdateDivider=1
IfCondition=(mBreath >= 0)
IfTrueAction=[!SetVariable ColonAlpha "[&mBreath:0]"][!UpdateMeter mtrDigits][!Redraw]
DynamicVariables=1

; 进场: chrome(meta/扫描框)淡入 → 数字淡入 → 日期/状态淡入
[mIntro]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat ChromeUp,16,16 | Wait 40 | Repeat DigitUp,14,18 | Wait 40 | Repeat MetaUp,18,14
ChromeUp=[!SetVariable ChromeAlpha "(Clamp(#ChromeAlpha#+16,0,255))"][!UpdateMeasure mIntro][!UpdateMeterGroup clock][!Redraw]
DigitUp=[!SetVariable DigitAlpha "(Clamp(#DigitAlpha#+15,0,255))"][!UpdateMeasure mIntro][!UpdateMeter mtrDigits][!UpdateMeter mtrSec][!Redraw]
MetaUp=[!SetVariable MetaAlpha "(Clamp(#MetaAlpha#+19,0,255))"][!UpdateMeasure mIntro][!UpdateMeterGroup clock][!Redraw]
DynamicVariables=1

; ============ STYLES ============

[stMeta]
StringAlign=CenterCenter
FontFile=#FontFileDisplayB#
FontFace=#FontFace#
FontSize=10
FontColor=219,233,251,#MetaAlpha#
StringCase=Upper
AntiAlias=1
DynamicVariables=1

[stDigits]
StringAlign=CenterCenter
FontFile=#FontFileDisplay#
FontFace=#FontFaceLight#
FontSize=120
FontColor=255,255,255,#DigitAlpha#
AntiAlias=1
ClipString=0
DynamicVariables=1

[stSec]
StringAlign=LeftCenter
FontFile=#FontFileDisplay#
FontFace=#FontFace#
FontSize=40
FontColor=255,255,255,(#DigitAlpha#*0.7)
AntiAlias=1
DynamicVariables=1

[stDateEN]
StringAlign=CenterCenter
FontFile=#FontFileDisplayB#
FontFace=#FontFace#
FontSize=14
FontColor=219,233,251,#MetaAlpha#
StringStyle=Bold
AntiAlias=1
DynamicVariables=1

[stDateCN]
StringAlign=CenterCenter
FontFile=#FontFileCN#
FontFace=#FontFaceCN#
FontSize=12
FontColor=141,166,196,#MetaAlpha#
AntiAlias=1
DynamicVariables=1

[stStatus]
StringAlign=CenterCenter
FontFile=#FontFileData#
FontFace=#FontFaceData#
FontSize=9
FontColor=141,166,196,#MetaAlpha#
StringCase=Upper
AntiAlias=1
DynamicVariables=1

; ============ METERS ============
; 画布 600×380, 中心 X=300。

; ---- CHRONOS meta (y=70) ----
[mtrMetaDiamondL]
Meter=Shape
X=148
Y=66
Shape=Rectangle 0,0,5,5 | Rotate 45,2.5,2.5 | Fill Color 255,59,59,#ChromeAlpha# | StrokeWidth 0
DynamicVariables=1
Group=clock
[mtrMetaLineL]
Meter=Shape
X=164
Y=68
Shape=Line 0,0,60,0 | StrokeWidth 1 | Stroke LinearGradient MetaLG
MetaLG=0 | 219,233,251,0 ; 0.0 | 219,233,251,#ChromeAlpha# ; 1.0
DynamicVariables=1
Group=clock
[mtrMeta]
Meter=String
MeterStyle=stMeta
MeasureName=mWeek
X=300
Y=70
Text=CHRONOS — WEEK %1
Group=clock
[mtrMetaLineR]
Meter=Shape
X=376
Y=68
Shape=Line 0,0,60,0 | StrokeWidth 1 | Stroke LinearGradient MetaRG
MetaRG=0 | 219,233,251,#ChromeAlpha# ; 0.0 | 219,233,251,0 ; 1.0
DynamicVariables=1
Group=clock
[mtrMetaDiamondR]
Meter=Shape
X=447
Y=66
Shape=Rectangle 0,0,5,5 | Rotate 45,2.5,2.5 | Fill Color 255,59,59,#ChromeAlpha# | StrokeWidth 0
DynamicVariables=1
Group=clock

; ---- 扫描框 上/下 (y=92 / y=228) ----
[mtrFrameTop]
Meter=Shape
X=40
Y=92
Shape=Line 0,0,520,0 | StrokeWidth 1 | Stroke Color 141,166,196,(#ChromeAlpha#*0.5)
DynamicVariables=1
Group=clock
[mtrFrameBot]
Meter=Shape
X=40
Y=228
Shape=Line 0,0,520,0 | StrokeWidth 1 | Stroke Color 141,166,196,(#ChromeAlpha#*0.5)
DynamicVariables=1
Group=clock

; ---- 大字 HH:MM (y=160), 纯白, 冒号呼吸 ----
[mtrDigits]
Meter=String
MeasureName=mTimeHM
MeterStyle=stDigits
X=290
Y=160
Text=%1
; 冒号纯白呼吸 (InlineSetting 改冒号 alpha, 非颜色)
InlineSetting=Color | 255,255,255,#ColonAlpha#
InlinePattern=:
LeftMouseUpAction=["explorer.exe" "shell:::{05D7B0F4-2121-4EFF-BF6B-ED3F69B894D9}"]
ToolTipText=点击: 打开 Windows 时钟设置
Group=clock
; 秒数小号上标 (跟在 HH:MM 右侧上方)
[mtrSec]
Meter=String
MeasureName=mSec
MeterStyle=stSec
X=510
Y=130
Text=%1
Group=clock

; ---- 日期 + 中文星期 (y=258) ----
[mtrDateEN]
Meter=String
MeasureName=mDateEN
MeterStyle=stDateEN
X=250
Y=258
StringCase=Upper
Text=%1
Group=clock
[mtrDateCN]
Meter=String
MeasureName=mWeekday
MeterStyle=stDateCN
X=400
Y=258
Text=%1
Group=clock

; ---- 状态条 (y=298) ----
[mtrStatusBox]
Meter=Shape
X=210
Y=288
Shape=Rectangle 0,0,180,20 | StrokeWidth 1 | Stroke Color 141,166,196,(#MetaAlpha#*0.5) | Fill Color 0,0,0,0
DynamicVariables=1
Group=clock
[mtrStatusDot]
Meter=Shape
X=224
Y=296
Shape=Ellipse 0,0,3 | Fill Color 74,222,128,#MetaAlpha# | StrokeWidth 0
DynamicVariables=1
Group=clock
[mtrStatus]
Meter=String
MeasureName=mDoY
MeterStyle=stStatus
X=304
Y=298
Text=System Nominal · D-%1 / 365
Group=clock
