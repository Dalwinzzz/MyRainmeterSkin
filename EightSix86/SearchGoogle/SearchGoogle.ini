; ============================================================
;  86 HUD · Search · GOOGLE
;  Long horizontal row: [G] GOOGLE  >>  [_____input_____]  [DISPATCH ⏎]
;  Click anywhere on the input row to type. Enter to dispatch.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
@include=#@#Variables.inc

[Metadata]
Name=86 Search · Google
Author=Dalwin
Information=Quick-search bar for Google. Click input area to type, Enter to dispatch.
Version=1.1.0
License=MIT

; ============ MEASURES ============

[mInput]
Measure=Plugin
Plugin=InputText
SolidColor=10,22,38,220
StringStyle=Bold
StringAlign=LeftCenter
FontFace=#FontFaceCN#
FontSize=11
FontColor=#ColorText#
AntiAlias=1
DefaultValue=""
FocusDismiss=1
Command1=["https://www.google.com/search?q=$UserInput$"]
X=130
Y=10
W=320
H=22
UpdateDivider=86400

; ============ STYLES ============

[stGlyph]
FontFace=#FontFace#
FontSize=12
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringAlign=CenterCenter
AntiAlias=1

[stName]
FontFace=#FontFace#
FontSize=9
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[stArrow]
FontFace=#FontFace#
FontSize=10
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1

[stPlaceholder]
FontFace=#FontFaceCN#
FontSize=11
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
AntiAlias=1
StringAlign=LeftCenter

[stDispatch]
FontFace=#FontFaceCN#
FontSize=9
FontColor=#ColorRed#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringAlign=CenterCenter
AntiAlias=1

; ============ METERS ============
; Canvas: 540 × 40

; Corner brackets
[mtrCornerTL]
Meter=Shape
X=0
Y=0
Shape=Path tlPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
tlPath=0,11 | LineTo 0,0 | LineTo 11,0

[mtrCornerTR]
Meter=Shape
X=529
Y=0
Shape=Path trPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
trPath=0,0 | LineTo 11,0 | LineTo 11,11

[mtrCornerBL]
Meter=Shape
X=0
Y=29
Shape=Path blPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
blPath=0,0 | LineTo 0,11 | LineTo 11,11

[mtrCornerBR]
Meter=Shape
X=529
Y=29
Shape=Path brPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
brPath=11,0 | LineTo 11,11 | LineTo 0,11

; Engine glyph (boxed letter G)
[mtrGlyphBox]
Meter=Shape
X=18
Y=11
Shape=Rectangle 0,0,20,20 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0

[mtrGlyph]
Meter=String
MeterStyle=stGlyph
X=28
Y=21
Text=G

; Engine name
[mtrName]
Meter=String
MeterStyle=stName
X=46
Y=14
Text=GOOGLE

; Arrow indicator (pure ASCII to avoid font glyph fragility)
[mtrArrow]
Meter=String
MeterStyle=stArrow
X=110
Y=14
Text=>>

; Input field box (visible click target)
[mtrInputBox]
Meter=Shape
X=126
Y=8
Shape=Rectangle 0,0,322,24 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 10,22,38,80

; Input underline (cyan emphasis)
[mtrInputLine]
Meter=Shape
X=128
Y=33
Shape=Line 0,0,318,0 | StrokeWidth 1 | Stroke Color #ColorCyanEdge#

; Placeholder text (visible until user clicks)
[mtrPlaceholder]
Meter=String
MeterStyle=stPlaceholder
X=134
Y=20
Text=点击此处搜索 · google.com

; Full-width transparent click hitarea over input box
[mtrInputHit]
Meter=Image
SolidColor=0,0,0,1
X=126
Y=8
W=322
H=24
LeftMouseUpAction=[!CommandMeasure mInput "ExecuteBatch 1"]
; Hover: box fill + underline brighten to signal the field is live.
MouseOverAction=[!SetOption mtrInputBox Shape "Rectangle 0,0,322,24 | StrokeWidth 1 | Stroke Color #ColorBlueIce# | Fill Color 10,22,38,140"][!SetOption mtrInputLine Shape "Line 0,0,318,0 | StrokeWidth 1.4 | Stroke Color #ColorBlueIce#"][!UpdateMeter mtrInputBox][!UpdateMeter mtrInputLine][!Redraw]
MouseLeaveAction=[!SetOption mtrInputBox Shape "Rectangle 0,0,322,24 | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 10,22,38,80"][!SetOption mtrInputLine Shape "Line 0,0,318,0 | StrokeWidth 1 | Stroke Color #ColorCyanEdge#"][!UpdateMeter mtrInputBox][!UpdateMeter mtrInputLine][!Redraw]
ToolTipText=点击此处输入搜索词；回车直达 Google

; Dispatch box (focal — red)
[mtrDispatchBox]
Meter=Shape
X=458
Y=8
Shape=Rectangle 0,0,74,24 | StrokeWidth 1 | Stroke Color #ColorRed# | Fill Color 200,30,58,46

[mtrDispatch]
Meter=String
MeterStyle=stDispatch
X=495
Y=20
Text=执行 ⏎

[mtrDispatchHit]
Meter=Image
SolidColor=0,0,0,1
X=458
Y=8
W=74
H=24
LeftMouseUpAction=[!CommandMeasure mInput "ExecuteBatch 1"]
; Focal button — hover deepens the red fill + brightens stroke.
MouseOverAction=[!SetOption mtrDispatchBox Shape "Rectangle 0,0,74,24 | StrokeWidth 1.4 | Stroke Color #ColorRedLight# | Fill Color 200,30,58,110"][!UpdateMeter mtrDispatchBox][!Redraw]
MouseLeaveAction=[!SetOption mtrDispatchBox Shape "Rectangle 0,0,74,24 | StrokeWidth 1 | Stroke Color #ColorRed# | Fill Color 200,30,58,46"][!UpdateMeter mtrDispatchBox][!Redraw]
ToolTipText=执行搜索
