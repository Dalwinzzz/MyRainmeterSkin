; ============================================================
;  86 HUD · System Roster
;  6-column tactical roster: NO / PERS / PWR / VAL / RATE / STA
;  5 rows: CPU LOAD / MEM USE / DSK C:\ / NET DOWN / NET UP
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
@include=#@#Variables.inc

[Metadata]
Name=86 System Roster
Author=Dalwin
Information=System monitor in tactical-roster format. Top-left placement per v1 design.
Version=1.1.0
License=MIT

; ============ MEASURES ============

[mCpu]
Measure=CPU
Processor=0

[mMem]
Measure=PhysicalMemory
UpdateDivider=2

[mDsk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=60

[mNetIn]
Measure=NetIn
NetInSpeed=10485760
; Adjust NetInSpeed to your max bandwidth in bits/s for accurate %.

[mNetOut]
Measure=NetOut
NetOutSpeed=10485760

; ============ STYLES ============

[stHead]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[stHeadStat]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
StringAlign=Right
AntiAlias=1

[stColHead]
FontFace=#FontFace#
FontSize=7
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
StringAlign=Center
AntiAlias=1

[stColHeadL]
FontFace=#FontFace#
FontSize=7
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[stRowNum]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
AntiAlias=1

[stRowLbl]
FontFace=#FontFace#
FontSize=9
FontColor=#ColorText#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringCase=Upper
AntiAlias=1

[stRowVal]
FontFace=#FontFace#
FontSize=10
FontColor=#ColorCyan#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringAlign=Center
AntiAlias=1

[stRowValAlert]
FontFace=#FontFace#
FontSize=10
FontColor=#ColorRed#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringStyle=Bold
StringAlign=Center
AntiAlias=1

[stRowRate]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorTextDim#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringAlign=Center
AntiAlias=1

[stRowRateAlert]
FontFace=#FontFace#
FontSize=8
FontColor=#ColorRed#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringAlign=Center
AntiAlias=1

[stMoon]
FontFace=Segoe UI Symbol
FontSize=10
FontColor=#ColorCyanEdge#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringAlign=Center
AntiAlias=1

[stMoonAlert]
FontFace=Segoe UI Symbol
FontSize=10
FontColor=#ColorRed#
FontEffectColor=#ColorShadow#
StringEffect=Shadow
StringAlign=Center
AntiAlias=1

; ============ METERS · CHROME ============
; Canvas: 340 × 178. 14px padding.

[mtrCornerTL]
Meter=Shape
X=0
Y=0
Shape=Path tlPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
tlPath=0,12 | LineTo 0,0 | LineTo 12,0

[mtrCornerTR]
Meter=Shape
X=328
Y=0
Shape=Path trPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
trPath=0,0 | LineTo 12,0 | LineTo 12,12

[mtrCornerBL]
Meter=Shape
X=0
Y=166
Shape=Path blPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
blPath=0,0 | LineTo 0,12 | LineTo 12,12

[mtrCornerBR]
Meter=Shape
X=328
Y=166
Shape=Path brPath | StrokeWidth 1 | Stroke Color #ColorCyanEdge# | Fill Color 0,0,0,0
brPath=12,0 | LineTo 12,12 | LineTo 0,12

[mtrHead]
Meter=String
MeterStyle=stHead
X=14
Y=14
Text=/ S-1 · SYSTEM ROSTER

[mtrHeadStat]
Meter=String
MeterStyle=stHeadStat
X=326
Y=14
Text=▼ ONLINE
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText=Click to open Task Manager

[mtrDivider1]
Meter=Shape
X=14
Y=32
Shape=Line 0,0,312,0 | StrokeWidth 1 | Stroke Color #ColorCyanEdge#

; Column headers
[mtrColNo]
Meter=String
MeterStyle=stColHead
X=28
Y=37
Text=NO

[mtrColPers]
Meter=String
MeterStyle=stColHeadL
X=46
Y=37
Text=PERS

[mtrColPwr]
Meter=String
MeterStyle=stColHead
X=180
Y=37
Text=PWR

[mtrColVal]
Meter=String
MeterStyle=stColHead
X=212
Y=37
Text=VAL

[mtrColRate]
Meter=String
MeterStyle=stColHead
X=246
Y=37
Text=RATE

[mtrColSta]
Meter=String
MeterStyle=stColHead
X=275
Y=37
Text=STA

[mtrDivider2]
