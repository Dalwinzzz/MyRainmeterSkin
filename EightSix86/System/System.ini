; ============================================================
;  86 HUD · System Roster
;  6-column tactical roster: NO / PERS / PWR / VAL / RATE / STA
;  5 rows: CPU LOAD / MEM USE / DSK C:\ / NET DOWN / NET UP
;
;  v1.2 — data-driven HUD:
;    · PWR  moon phase (5-step) follows live load
;    · RATE trend arrow (▲ / ▼ / ──) diffed each update
;    · STA  status dot recolors on threshold breach
;    · DESTROYED stamp slams over a row when its feed flatlines
;    · startup scan-line + per-row reveal (ActionTimer)
;  Data logic lives in @Resources\Scripts\Roster.lua.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@include=#@#Variables.inc
OnRefreshAction=[!HideMeterGroup roster][!SetVariable ScanY "36"][!UpdateMeter mtrScanLine][!CommandMeasure mIntro "Execute 1"]

; Local intro-animation variables (merged with the global [Variables]
; pulled in via @include above).
[Variables]
ScanY=36

[Metadata]
Name=86 System Roster
Author=Dalwin
Information=System monitor in tactical-roster format. Top-left placement per v1 design. Data-driven moon/trend/status + DESTROYED stamp + startup scan reveal.
Version=1.2.0
License=MIT

; ============ MEASURES ============

[mCpu]
Measure=CPU
Processor=0

[mMem]
Measure=PhysicalMemory
UpdateDivider=2

[mDsk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=60

[mNetIn]
Measure=NetIn
NetInSpeed=10485760
; Adjust NetInSpeed to your max bandwidth in bits/s for accurate %.

[mNetOut]
Measure=NetOut
NetOutSpeed=10485760

; Lua driver: maps the above measures into moon / trend / status / stamp.
[mScript]
Measure=Script
ScriptFile=#@#Scripts\Roster.lua
UpdateDivider=1

; ---- Startup intro: a single cyan scan-line sweeps down the roster,
;      then the whole roster snaps online together (signature moment).
[mIntro]
Measure=Plugin
Plugin=ActionTimer
; 18 steps × 8px = 144px sweep from y=36 down to y=180, ~18ms apart.
ActionList1=Repeat ScanStep,18,18 | Wait 60 | RosterOnline
; !UpdateMeasure mIntro re-evaluates #ScanY# inside the loop (required by ActionTimer).
ScanStep=[!SetVariable ScanY "(#ScanY#+8)"][!UpdateMeasure mIntro][!UpdateMeter mtrScanLine][!Redraw]
; Sweep done: hide the scan line, reveal every roster row at once.
RosterOnline=[!HideMeter mtrScanLine][!ShowMeterGroup roster][!Redraw]
DynamicVariables=1

