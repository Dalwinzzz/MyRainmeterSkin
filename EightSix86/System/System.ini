; Startup scan-line — sweeps down the roster on load, then self-hides.
; NOT in the roster group: the group is hidden during the sweep, the
; scan line must stay visible. Y is driven by #ScanY# from mIntro.
[mtrScanLine]
Meter=Shape
X=14
Y=#ScanY#
Shape=Rectangle 0,0,312,2 | Fill LinearGradient ScanGrad | StrokeWidth 0
ScanGrad=0 | 30,90,200,0 ; 0.0 | #ColorBlueEdge# ; 0.5 | 30,90,200,0 ; 1.0
DynamicVariables=1

